<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <link rel="stylesheet" href="style/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="message" id="message"></div>
        
        <div class="buttons" id="navigation">
            <button id="prevBtn" onclick="previousMessage()">← Previous</button>
            <button id="nextBtn" onclick="nextMessage()">Next →</button>
        </div>
        
        <div class="page-counter" id="counter"></div>

        <div class="flower-container" id="flowerContainer">
            <div class="flower">💐</div>
            <div class="flower-message">Here's a flower for you! I love you so much!</div>
        </div>
        <div class="footer">
            <p>From me to you ❤️</p>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
